# Coolify (Docker Compose build pack) cho storefront + admin (Next.js).
#
# Cách dùng trên Coolify:
#   1. New Resource -> Docker Compose -> chọn repo app, Compose file: /docker-compose.image.yml
#   2. Image được build sẵn trên GHCR (GitHub Actions). NEXT_PUBLIC_API_URL đã nhúng lúc build
#      (biến Actions `NEXT_PUBLIC_API_URL` của repo) -> đổi API URL thì build lại image, không
#      đổi được ở Coolify. IMAGE_TAG: `latest` hoặc sha-xxxx / phiên bản (nên ghim tag cụ thể).
#   3. Gán domain cho service `web` (cổng 3400) trong tab Domains, rồi đặt FE_HOST của
#      repo ecommerce-be bằng đúng domain này (CORS).
#
# Không publish `ports`: Coolify (Traefik) tự proxy tới cổng 3400.

services:
  web:
    image: ghcr.io/longnguyendev/ecommerce-fe:${IMAGE_TAG:-latest}
    environment:
      # Coolify tự sinh domain cho service này (có thể đổi trong tab Domains).
      SERVICE_FQDN_WEB_3400: ""
      NODE_ENV: production
      PORT: 3400
      HOSTNAME: 0.0.0.0
    expose:
      - "3400"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3400/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
